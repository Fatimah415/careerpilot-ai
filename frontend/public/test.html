<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testPing()">Test Ping</button>
    <button onclick="testRegister()">Test Register</button>
    <pre id="result" style="background:#f0f0f0;padding:10px;margin-top:20px;"></pre>

    <script>
        async function testPing() {
            document.getElementById('result').innerText = 'Testing ping...';
            try {
                const response = await fetch('http://127.0.0.1:5000/api/ping');
                const data = await response.json();
                document.getElementById('result').innerText = 'Ping Success!\n' + JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById('result').innerText = 'Ping Failed!\n' + err.message;
            }
        }

        async function testRegister() {
            document.getElementById('result').innerText = 'Testing register...';
            try {
                const response = await fetch('http://127.0.0.1:5000/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test123',
                        full_name: 'Test User'
                    })
                });
                const data = await response.json();
                document.getElementById('result').innerText = 'Register Response:\n' + JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById('result').innerText = 'Register Failed!\n' + err.message;
            }
        }
    </script>
</body>
</html>
